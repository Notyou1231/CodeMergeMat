name: Snowflake Migration - List & Execute

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose "List" to see script numbers or "Execute" to run them'
        required: true
        default: 'List'
        type: choice
        options: [List, Execute]
      file_path:
        description: 'Path to Excel migration document'
        required: true
      run_script:
        description: 'Enter Script # or "All"'
        required: false
        default: 'All'

jobs:
  process-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Requires requirements.txt in root

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Script Logic
        shell: python
        env:
          SNOW_ACCOUNT: ${{ secrets.SNOW_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOW_USER }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          RUN_SCRIPT: ${{ github.event.inputs.run_script }}
        run: |
          import pandas as pd
          import re, os, snowflake.connector, sys

          file_path = "${{ github.event.inputs.file_path }}"
          df = pd.read_excel(file_path)
          found_scripts = []
          
          # Regex matches any string ending in .sql
          regex_pattern = r"([a-zA-Z0-9/_.\-\\]+\.sql)"

          for _, row in df.iterrows():
              task_val = str(row.iloc[1])
              dep_val = str(row.iloc[4])
              
              matches = re.findall(regex_pattern, task_val)
              for m in matches:
                  # Normalize path for the runner OS
                  clean_path = m.replace('\\', os.sep).replace('/', os.sep)
                  
                  # STRICT FILTER: Only add if the file actually exists in the repo
                  if os.path.exists(clean_path):
                      found_scripts.append({
                          "path": clean_path,
                          "dep": dep_val if dep_val != 'nan' else "None",
                          "is_backout": "rollback" in clean_path.lower()
                      })

          summary_file = os.environ['GITHUB_STEP_SUMMARY']

          if os.getenv('ACTION_TYPE') == 'List':
              with open(summary_file, 'a') as f:
                  f.write("Detected Migration Scripts\n")
                  f.write("| # | Script Path | Dependency | Type |\n|---|-------------|------------|------|\n")
                  for i, s in enumerate(found_scripts, 1):
                      stype = "Rollback" if s['is_backout'] else "Migration"
                      f.write(f"| {i} | `{s['path']}` | {s['dep']} | {stype} |\n")
          else:
              # Execution Logic
              run_idx = os.getenv('RUN_SCRIPT')
              ctx = snowflake.connector.connect(
                  user=os.getenv('SNOW_USER'),
                  password=os.getenv('SNOW_PASSWORD'),
                  account=os.getenv('SNOW_ACCOUNT')
              )
              cs = ctx.cursor()
              results = []
              for i, s in enumerate(found_scripts, 1):
                  if run_idx == str(i) or (run_idx.lower() == 'all' and not s['is_backout']):
                      try:
                          with open(s['path'], 'r') as fc:
                              for stmt in fc.read().split(';'):
                                  if stmt.strip(): cs.execute(stmt)
                          results.append({"id": i, "status": "✅ Success", "path": s['path'], "msg": "OK"})
                      except Exception as e:
                          results.append({"id": i, "status": "❌ Failed", "path": s['path'], "msg": str(e)[:100]})
              
              with open(summary_file, 'a') as f:
                  f.write("Execution Report\n| # | Status | Path | Details |\n|---|---|---|---|\n")
                  for r in results:
                      f.write(f"| {r['id']} | {r['status']} | `{r['path']}` | {r['msg']} |\n")
              
              cs.close(); ctx.close()
              if any("Failed" in res['status'] for res in results): sys.exit(1)
