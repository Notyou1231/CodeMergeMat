name: Snowflake Migration - List & Execute

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose "List" to see script numbers or "Execute" to run them'
        required: true
        default: 'List'
        type: choice
        options:
          - List
          - Execute
      file_path:
        description: 'Path to Excel migration document'
        required: true
        default: 'Migration_Documents/S-527323_S-539527_Migration.xlsx'
      run_script:
        description: 'If Executing, enter Script Number (e.g., 3) or "All" for standard migration'
        required: false
        default: 'All'

jobs:
  process-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install pandas openpyxl snowflake-connector-python

      - name: Script Logic
        shell: python
        env:
          SNOW_ACCOUNT: ${{ secrets.SNOW_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOW_USER }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          RUN_SCRIPT: ${{ github.event.inputs.run_script }}
        run: |
          import pandas as pd
          import re, os, snowflake.connector

          # 1. Extract scripts from Excel
          file_path = "${{ github.event.inputs.file_path }}"
          if not os.path.exists(file_path):
              print(f"Error: Excel file not found at {file_path}")
              exit(1)

          df = pd.read_excel(file_path)
          found_scripts = []
          for _, row in df.iterrows():
              task_val, dep_val = str(row.iloc[1]), str(row.iloc[4])
              match = re.search(r"(snowflake/[a-zA-Z0-9/_.-]+\.sql)", task_val)
              if match:
                  path = match.group(1)
                  found_scripts.append({
                      "path": path,
                      "dep": dep_val if dep_val != 'nan' else "None",
                      "is_backout": "rollback_scripts" in path or "BackOut" in task_val
                  })

          # 2. Handle "List" Mode
          if os.getenv('ACTION_TYPE') == 'List':
              summary_file = os.environ['GITHUB_STEP_SUMMARY']
              with open(summary_file, 'a') as f:
                  f.write("## 📋 Available Migration Scripts\n")
                  f.write("| Script Number | Script Path | Dependency |\n")
                  f.write("|---------------|-------------|------------|\n")
                  for i, s in enumerate(found_scripts, 1):
                      f.write(f"| {i} | `{s['path']}` | {s['dep']} |\n")
                  f.write(f"\n> **Note:** Role and Warehouse are managed within the SQL scripts themselves.")
              print("Table Summary generated successfully.")

          # 3. Handle "Execute" Mode
          else:
              run_idx = os.getenv('RUN_SCRIPT')
              print(f"--- Starting Execution Phase (Mode: {run_idx}) ---")
              
              ctx = snowflake.connector.connect(
                  user=os.getenv('SNOW_USER'),
                  password=os.getenv('SNOW_PASSWORD'),
                  account=os.getenv('SNOW_ACCOUNT')
              )
              cs = ctx.cursor()

              executed_count = 0
              for i, s in enumerate(found_scripts, 1):
                  is_targeted = (run_idx == str(i))
                  is_auto_run = (run_idx.lower() == 'all' and not s['is_backout'] and s['dep'] == "None")
                  
                  if is_targeted or is_auto_run:
                      if os.path.exists(s['path']):
                          print(f"[EXECUTING] Script Number {i}: {s['path']}")
                          executed_count += 1
                          with open(s['path'], 'r') as file_content:
                              # Split by semicolon to ensure USE ROLE/WAREHOUSE run first
                              for stmt in file_content.read().split(';'):
                                  if stmt.strip():
                                      cs.execute(stmt)
                      else:
                          print(f"ERROR: File {s['path']} not found!")
                          exit(1)
                  
                  elif run_idx.lower() == 'all':
                      if s['is_backout']:
                          print(f"Note: Script {i} was skipped (Backout Script)")
                      elif s['dep'] != "None":
                          print(f"Note: Script {i} was skipped (Has Dependency: {s['dep']})")
              
              cs.close(); ctx.close()
              print(f"\n--- Process Finished. Successfully executed {executed_count} scripts. ---")
