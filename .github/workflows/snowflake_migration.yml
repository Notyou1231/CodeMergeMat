name: Snowflake Migration - List & Execute

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose "List" to see script numbers or "Execute" to run them'
        required: true
        default: 'List'
        type: choice
        options:
          - List
          - Execute
      file_path:
        description: 'Path to Excel migration document'
        required: true
      run_script:
        description: 'If Executing, enter Script Number (e.g., 3) or "All"'
        required: false
        default: 'All'

jobs:
  process-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Script Logic
        shell: python
        env:
          SNOW_ACCOUNT: ${{ secrets.SNOW_ACCOUNT }}
          SNOW_USER: ${{ secrets.SNOW_USER }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          ACTION_TYPE: ${{ github.event.inputs.action_type }}
          RUN_SCRIPT: ${{ github.event.inputs.run_script }}
        run: |
          import pandas as pd
          import re, os, snowflake.connector, sys

          # 1. Extract scripts from Excel
          file_path = "${{ github.event.inputs.file_path }}"
          if not os.path.exists(file_path):
              print(f"Error: Excel file not found at {file_path}")
              sys.exit(1)

          df = pd.read_excel(file_path)
          found_scripts = []
          for _, row in df.iterrows():
              # Normalize slashes to forward slashes for regex matching
              task_val = str(row.iloc[1]).replace('\\', '/')
              dep_val = str(row.iloc[4])
              
              # Regex updated to find paths starting with 'standard'
              match = re.search(r"([^ ]*snowflake/[a-zA-Z0-9/_.-]+\.sql)", task_val)
              
              if match:
                  # Convert path back to OS format
                  original_path = match.group(1).replace('/', os.sep)
                  found_scripts.append({
                      "path": original_path,
                      "dep": dep_val if dep_val != 'nan' else "None",
                      "is_backout": "rollback_scripts" in original_path.lower() or "backout" in task_val.lower()
                  })

          summary_file = os.environ['GITHUB_STEP_SUMMARY']

          # 2. Handle "List" Mode
          if os.getenv('ACTION_TYPE') == 'List':
              with open(summary_file, 'a') as f:
                  f.write("## 📋 Available Migration Scripts\n")
                  f.write("| Script Number | Script Path | Dependency |\n")
                  f.write("|---------------|-------------|------------|\n")
                  for i, s in enumerate(found_scripts, 1):
                      f.write(f"| {i} | `{s['path']}` | {s['dep']} |\n")
          
          # 3. Handle "Execute" Mode
          else:
              run_idx = os.getenv('RUN_SCRIPT')
              ctx = snowflake.connector.connect(
                  user=os.getenv('SNOW_USER'),
                  password=os.getenv('SNOW_PASSWORD'),
                  account=os.getenv('SNOW_ACCOUNT')
              )
              cs = ctx.cursor()
              results = []
              executed_count = 0
              for i, s in enumerate(found_scripts, 1):
                  is_targeted = (run_idx == str(i))
                  is_auto_run = (run_idx.lower() == 'all' and not s['is_backout'] and s['dep'] == "None")
                  
                  if is_targeted or is_auto_run:
                      if os.path.exists(s['path']):
                          try:
                              executed_count += 1
                              with open(s['path'], 'r') as fc:
                                  for stmt in fc.read().split(';'):
                                      if stmt.strip(): cs.execute(stmt)
                              results.append({"id": i, "path": s['path'], "status": "✅ Success", "msg": "Executed"})
                          except Exception as e:
                              results.append({"id": i, "path": s['path'], "status": "❌ Failed", "msg": str(e).replace('\n', ' ')})
                      else:
                          results.append({"id": i, "path": s['path'], "status": "⚠️ Error", "msg": f"File not found: {s['path']}"})
              
              has_failures = False
              with open(summary_file, 'a') as f:
                  f.write("Execution Report\n| Script # | Status | Path | Details |\n|---|---|---|---|\n")
                  for r in results:
                      f.write(f"| {r['id']} | {r['status']} | `{r['path']}` | {r['msg']} |\n")
                      if "Failed" in r['status'] or "Error" in r['status']: has_failures = True
              
              cs.close(); ctx.close()
              if has_failures: sys.exit(1)
